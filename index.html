<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One Question</title>
  <style>
    body{font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff0f6}
    .card{width:min(92vw,420px);background:#fff;padding:26px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center}
    h1{font-size:26px;margin:0 0 14px}
    .stage{position:relative;height:160px;margin-top:14px}
    button{font-size:18px;padding:12px 18px;border:0;border-radius:12px;cursor:pointer;user-select:none;touch-action:manipulation}
    #yes{background:#22c55e;color:white}
    #no{background:#ef4444;color:white;position:absolute;left:52%;top:70px;transform:translateX(-50%);transition:transform .12s ease}
    #msg{margin-top:14px;font-size:16px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Ayesha Muhammad Amer</h2>
<h1>Will you be Ibrahim's Valentine? 💘</h1>
    <div class="stage" id="stage">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");
    const msg = document.getElementById("msg");

    let noCount = 0;

    function placeNo() {
      const pad = 10;
      const maxX = stage.clientWidth - no.offsetWidth - pad;
      const maxY = stage.clientHeight - no.offsetHeight - pad;
      const x = pad + Math.random() * Math.max(0, maxX - pad);
      const y = pad + Math.random() * Math.max(0, maxY - pad);
      no.style.left = x + "px";
      no.style.top = y + "px";
    }

    function onNoTap(e) {
      e.preventDefault();
      noCount++;
      no.style.transform = `translateX(0) scale(${Math.max(0.72, 1 - noCount*0.1)})`;

      if (noCount === 1) msg.textContent = "ghalat wala hai 😅";
      if (noCount === 2) msg.textContent = "dihaan dein yes pe Ayesha";
      if (noCount === 3) msg.textContent = "yes green waala hai jaan";
      if (noCount === 4) msg.textContent = "mani pedi karwa ke dounga 👀";
      if (noCount === 5) msg.textContent = "matcha dila ke dounga 👀";
      if (noCount === 6) msg.textContent = "bas bohat hogaya choice hi nahin hai";

      placeNo();

      if (noCount >= 7) {
        no.textContent = "hai hi nahin choice 🤷🏻‍♂️";
        no.style.background = "#a855f7";
        msg.textContent = "HAI HI NAHINN CHOICE 🤷🏻‍♂️";
      }
    }

    no.addEventListener("click", onNoTap);
    no.addEventListener("touchstart", onNoTap, { passive: false });

    yes.addEventListener("click", () => {
      msg.innerHTML = "aayi na line pe 😁<br>Ok now you’re officially my Valentine 😎🌹";
      no.style.display = "none";
      yes.textContent = "I love you 😘";
      yes.disabled = true;
      yes.style.opacity = 0.9;
    });

    placeNo();
  </script>
</body>
</html>
